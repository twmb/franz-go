name: validate definitions

on:
  push:
    branches: ["master"]
    paths:
      - 'generate/**'
      - '.github/workflows/validate-definitions.yml'
  pull_request:
    branches: ["*"]
    paths:
      - 'generate/**'
      - '.github/workflows/validate-definitions.yml'
  # A new Kafka release moves the latest-tag checkout, so run on a schedule
  # too: without this, a release that adds request versions produces no
  # signal until someone happens to touch generate/ (Kafka 4.3 went
  # unnoticed exactly this way).
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: validate-definitions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-definitions:
    if: github.repository == 'twmb/franz-go'
    runs-on: ubuntu-latest
    name: "validate DSL against Kafka JSON"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # The newest release tag, unless a release candidate for a newer
      # version is staged for a vote: then the RC, so that a release's
      # protocol changes are validated before the release is tagged. An RC
      # is dropped as soon as its version is released.
      - name: Find the newest Kafka release or release candidate
        id: kafka-version
        run: |
          REL=$(git ls-remote --tags https://github.com/apache/kafka.git \
            | sed -n 's|.*refs/tags/\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' \
            | sort -V | tail -1)
          RC=$(curl -sf https://dist.apache.org/repos/dist/dev/kafka/ \
            | sed -n 's|.*href="\([0-9]*\.[0-9]*\.[0-9]*-rc[0-9]*\)/".*|\1|p' \
            | sort -V | tail -1 || true)
          VER=${RC%-rc*}
          if [ -n "$RC" ] && [ "$VER" != "$REL" ] && [ "$(printf '%s\n%s\n' "$REL" "$VER" | sort -V | tail -1)" = "$VER" ]; then
            echo "Using Kafka $RC (newer than the $REL release)"
            echo "rc=$RC" >> "$GITHUB_OUTPUT"
          else
            echo "Using Kafka $REL"
            echo "tag=$REL" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.kafka-version.outputs.tag != ''
        with:
          repository: apache/kafka
          ref: ${{ steps.kafka-version.outputs.tag }}
          path: kafka
          sparse-checkout: clients/src/main/resources/common/message
      # RC tags reach GitHub late or never; the staged source tarball is the
      # artifact under vote.
      - name: Fetch the release candidate source
        if: steps.kafka-version.outputs.rc != ''
        run: |
          RC=${{ steps.kafka-version.outputs.rc }}
          mkdir kafka
          curl -sSfL "https://dist.apache.org/repos/dist/dev/kafka/$RC/kafka-${RC%-rc*}-src.tgz" \
            | tar xz -C kafka --strip-components=1
      - run: cd generate && go test -run TestValidateDSLAgainstKafkaJSON -v
        env:
          KAFKA_DIR: ${{ github.workspace }}/kafka
